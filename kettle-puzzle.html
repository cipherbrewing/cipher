<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kettle 2.0 Puzzle</title>
<style>
:root{
  --bg:#0a0a0a; --ink:#cfcfcf; --ink-dim:#8a8a8a; --ink-faint:#5a5a5a;
  --line:#333; --line-soft:#222; --amber:#c9a26a; --err:#7a4a4a;
  --frame:#151515; --tray:#0f0f0f;
  --mono:"SFMono-Regular",ui-monospace,"Menlo","Consolas",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
[hidden]{display:none!important}
.brandmark{font-size:12px;letter-spacing:.4em;color:var(--ink-faint);margin-bottom:2.4rem;padding-left:.4em}
.prompt{font-size:13px;letter-spacing:.12em;color:var(--ink-dim);line-height:1.9;margin:0 0 2.2rem}
.board{width:100%}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.piece{cursor:grab}
.piece.anim{transition:transform .18s ease}
.piece.drag{cursor:grabbing}
.piece.drag{filter:drop-shadow(0 10px 12px rgba(0,0,0,.7))}
.piece:focus{outline:none}
.piece:focus-visible .edge{stroke:var(--ink)}
.tools{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:1rem;font-size:11px;letter-spacing:.15em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tools b{font-weight:400;color:var(--ink-dim)}
.stats{display:flex;gap:18px}
.link{background:transparent;border:0;color:var(--ink-faint);font:inherit;letter-spacing:inherit;cursor:pointer;padding:4px 0}
.link:hover,.link:focus-visible{color:var(--amber);outline:none}
.status{font-size:12px;letter-spacing:.1em;color:var(--amber);min-height:18px;margin-top:1.2rem}

.answer{width:100%;max-width:520px;margin-top:3.2rem;padding-top:2.4rem;border-top:.5px solid var(--line-soft)}
.alabel{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-bottom:1.8rem}
.words{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.wordin{width:112px;background:transparent;border:0;border-bottom:2px solid var(--line);color:#e8e8e8;font-family:var(--mono);font-size:18px;text-align:center;padding:8px 4px;letter-spacing:.08em;border-radius:0;transition:border-color .3s}
.wordin:focus{outline:none;border-bottom-color:var(--ink-faint)}
.answer.ok .wordin{border-bottom-color:var(--amber);color:var(--amber)}
.answer.bad .wordin{border-bottom-color:var(--err)}
.answer.bad .words{animation:shake .35s}
#submit{background:transparent;border:.5px solid var(--line);color:var(--ink-dim);font-family:var(--mono);font-size:12px;letter-spacing:.2em;padding:10px 22px;border-radius:8px;cursor:pointer;margin-bottom:1.6rem;transition:border-color .3s,color .3s}
#submit:hover,#submit:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
#msg{font-size:12px;letter-spacing:.1em;color:var(--ink-faint);min-height:18px}
.answer.ok #msg{color:var(--amber)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.piece.anim{transition:none}.answer.bad .words{animation:none}}

/* Story page shown after the correct answer */
#reveal{max-width:620px;width:100%;text-align:left;line-height:1.8;font-size:14px;color:var(--ink)}
#reveal .rlabel{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-bottom:2rem;text-align:center}
#reveal h1{font-size:20px;font-weight:400;letter-spacing:.05em;color:#e8e8e8;margin:0 0 1.6rem;text-align:center}
#reveal p{margin:0 0 1.2rem;color:var(--ink-dim)}
#reveal .fourwords{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:2rem 0;font-size:15px;color:var(--amber);letter-spacing:.1em}
</style>
</head>
<body>

<div class="wrap">

  <!-- PUZZLE: shown first -->
  <div id="game" style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="brandmark">CIPHER BREWING</div>
    <p class="prompt">eight pieces. one frame.<br>fit them all in.</p>

    <div class="board">
      <svg id="svg" viewBox="0 0 1194 487" role="application" aria-label="Puzzle board. Drag pieces to move them, click to turn them.">
        <rect x="58" y="58" width="1078" height="370" style="fill:var(--tray)"/>
        <path id="frame" style="fill:var(--frame);stroke:var(--line)" stroke-width="1.5" fill-rule="evenodd"/>
        <defs>
          <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7d5f36"/>
            <stop offset=".22" stop-color="#c9a468"/>
            <stop offset=".38" stop-color="#f1dcaa"/>
            <stop offset=".5" stop-color="#c49c5e"/>
            <stop offset=".72" stop-color="#8f6d3e"/>
            <stop offset=".88" stop-color="#d2b075"/>
            <stop offset="1" stop-color="#6e522c"/>
          </linearGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff6de" stop-opacity=".75"/>
            <stop offset=".45" stop-color="#fff6de" stop-opacity="0"/>
            <stop offset=".55" stop-color="#000" stop-opacity="0"/>
            <stop offset="1" stop-color="#000" stop-opacity=".55"/>
          </linearGradient>
          <pattern id="brush" width="400" height="7" patternUnits="userSpaceOnUse">
            <rect width="400" height="1" y="1" fill="#fff" opacity=".10"/>
            <rect width="400" height="1" y="4" fill="#000" opacity=".10"/>
            <rect width="170" height="1" y="5.5" x="60" fill="#fff" opacity=".08"/>
          </pattern>
        </defs>
        <g id="pieces"></g>
      </svg>
    </div>

    <div class="tools">
      <button class="link" id="shuffle" type="button">↻ shuffle</button>
      <span class="hint">drag to move · tap to turn</span>
      <span class="stats"><span>moves <b id="moves">0</b></span><span>time <b id="time">0:00</b></span></span>
    </div>
    <div class="status" id="status" aria-live="polite"></div>

    <form class="answer" id="answer" autocomplete="off" novalidate>
      <div class="alabel">WHAT'S THE WORD?</div>
      <div class="words">
        <input class="wordin" maxlength="20" aria-label="Word 1" autocapitalize="none" autocorrect="off" spellcheck="false">
        <input class="wordin" maxlength="20" aria-label="Word 2" autocapitalize="none" autocorrect="off" spellcheck="false">
        <input class="wordin" maxlength="20" aria-label="Word 3" autocapitalize="none" autocorrect="off" spellcheck="false">
        <input class="wordin" maxlength="20" aria-label="Word 4" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div><button type="submit" id="submit">submit</button></div>
      <div id="msg" aria-live="polite"></div>
    </form>
  </div>

  <!-- STORY: shown after the four words are entered correctly -->
  <section id="reveal" hidden>
    <div class="rlabel">CIPHER BREWING</div>
    <h1>STORY TITLE HERE</h1>
    <p>Replace this with the grower's story.</p>
    <p>Add as many paragraphs as needed.</p>
    <div class="fourwords"><span>WORD1</span><span>WORD2</span><span>WORD3</span><span>WORD4</span></div>
  </section>

</div>
