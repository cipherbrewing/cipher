<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cipher Brewing</title>
<style>
  :root{
    --bg:#0a0a0a;
    --ink:#cfcfcf;
    --ink-dim:#8a8a8a;
    --ink-faint:#5a5a5a;
    --line:#333;
    --line-soft:#222;
    --amber:#c9a26a;
    --err:#7a4a4a;
    --mono:"SFMono-Regular",ui-monospace,"Menlo","Consolas",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  /* ---------- GATE ---------- */
  #gate{width:100%;max-width:360px;text-align:center;padding:2rem 1.2rem;transition:opacity .8s;}
  .brandmark{font-size:12px;letter-spacing:.4em;color:var(--ink-faint);margin-bottom:2.4rem;}
  .prompt{font-size:13px;letter-spacing:.12em;color:var(--ink-dim);line-height:1.9;margin-bottom:2.2rem;}
  #dots{display:flex;gap:14px;justify-content:center;margin-bottom:2rem;}
  .slot{width:38px;height:48px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;color:#e8e8e8;transition:border-color .3s;}
  #pwwrap{position:relative;}
  #pw{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;border:0;background:transparent;font-size:16px;cursor:pointer;}
  #tap{background:transparent;border:.5px solid var(--line);color:var(--ink-dim);font-family:var(--mono);font-size:12px;letter-spacing:.2em;padding:10px 22px;border-radius:8px;cursor:pointer;margin-bottom:1.6rem;}
  #tap:hover{border-color:var(--ink-faint);color:var(--ink);}
  #msg{font-size:12px;letter-spacing:.1em;color:var(--ink-faint);min-height:18px;}

  /* ---------- REVEAL ---------- */
  #reveal{display:none;position:fixed;inset:0;background:var(--bg);padding:3rem 1.6rem;overflow-y:auto;}
  #beat{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:5;}
  #beatword{font-size:28px;letter-spacing:.5em;color:var(--amber);padding-left:.5em;}
  .beat-label{font-size:11px;letter-spacing:.3em;color:#4a4a4a;margin-top:1.4rem;text-align:center;}
  #note{opacity:0;transition:opacity 1.4s;max-width:440px;margin:0 auto;position:relative;z-index:2;}
  #note .brandmark{text-align:center;margin-bottom:2.6rem;}

  /* ---------- COLLAGE BACKGROUND (solid tiles, swap in your photos) ---------- */
  #collage{
    position:fixed;inset:0;z-index:0;
    display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    opacity:.4;pointer-events:none;
  }
  #collage .ct{background:#1a1a1a;}
  #collage::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(10,10,10,.55) 0%, rgba(10,10,10,.78) 100%);
  }
  @media (max-width:860px){ #collage{opacity:.32;} }

  .letter{font-size:14px;line-height:2.1;color:var(--ink);letter-spacing:.04em;}
  .letter p{margin:0 0 1.4rem;}
  .word{color:var(--amber);}
  .sign{color:var(--ink-dim);margin-bottom:.4rem!important;}
  .sign-sub{color:var(--ink-faint);font-size:12px;letter-spacing:.06em;margin:0;}

  /* ---------- CONTACT FORM ---------- */
  .contact{margin-top:2.8rem;padding-top:1.8rem;border-top:.5px solid var(--line-soft);max-width:440px;margin-left:auto;margin-right:auto;}
  .contact-label{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-bottom:1.4rem;text-align:center;}
