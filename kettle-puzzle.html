<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kettle 2.0 Puzzle</title>
<style>
:root{
  --bg:#0a0a0a; --ink:#cfcfcf; --ink-dim:#8a8a8a; --ink-faint:#5a5a5a;
  --line:#333; --line-soft:#222; --amber:#c9a26a; --err:#7a4a4a;
  --frame:#151515; --tray:#0f0f0f;
  --mono:"SFMono-Regular",ui-monospace,"Menlo","Consolas",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:48px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.brandmark{font-size:12px;letter-spacing:.4em;color:var(--ink-faint);margin-bottom:2.4rem;padding-left:.4em}
.prompt{font-size:13px;letter-spacing:.12em;color:var(--ink-dim);line-height:1.9;margin:0 0 2.2rem}
.board{width:100%}
svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.piece{cursor:grab}
.piece.anim{transition:transform .18s ease}
.piece.drag{cursor:grabbing}
.piece.drag{filter:drop-shadow(0 10px 12px rgba(0,0,0,.7))}
.piece:focus{outline:none}
.piece:focus-visible .edge{stroke:var(--ink)}
.tools{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:1rem;font-size:11px;letter-spacing:.15em;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.tools b{font-weight:400;color:var(--ink-dim)}
.stats{display:flex;gap:18px}
.link{background:transparent;border:0;color:var(--ink-faint);font:inherit;letter-spacing:inherit;cursor:pointer;padding:4px 0}
.link:hover,.link:focus-visible{color:var(--amber);outline:none}
.status{font-size:12px;letter-spacing:.1em;color:var(--amber);min-height:18px;margin-top:1.2rem}

.answer{width:100%;max-width:360px;margin-top:3.2rem;padding-top:2.4rem;border-top:.5px solid var(--line-soft)}
.alabel{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-bottom:1.8rem}
#pwwrap{position:relative;display:inline-block}
#dots{display:flex;gap:14px;justify-content:center;margin-bottom:2rem}
.slot{width:38px;height:48px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;color:#e8e8e8;transition:border-color .3s,color .3s}
.slot.cur{border-bottom-color:var(--ink-faint)}
#pw{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:transparent;font-size:16px;cursor:pointer;color:transparent;caret-color:transparent}
.answer.ok .slot{border-bottom-color:var(--amber);color:var(--amber)}
.answer.bad .slot{border-bottom-color:var(--err)}
.answer.bad #dots{animation:shake .35s}
#submit{background:transparent;border:.5px solid var(--line);color:var(--ink-dim);font-family:var(--mono);font-size:12px;letter-spacing:.2em;padding:10px 22px;border-radius:8px;cursor:pointer;margin-bottom:1.6rem;transition:border-color .3s,color .3s}
#submit:hover,#submit:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
#msg{font-size:12px;letter-spacing:.1em;color:var(--ink-faint);min-height:18px}
.answer.ok #msg{color:var(--amber)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.piece.anim{transition:none}.answer.bad #dots{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="brandmark">CIPHER BREWING</div>
  <p class="prompt">eight pieces. one frame.<br>fit them all in.</p>

  <div class="board">
    <svg id="svg" viewBox="0 0 1194 487" role="application" aria-label="Puzzle board. Drag pieces to move them, click to turn them.">
      <rect x="58" y="58" width="1078" height="370" style="fill:var(--tray)"/>
      <path id="frame" style="fill:var(--frame);stroke:var(--line)" stroke-width="1.5" fill-rule="evenodd"/>
      <defs>
        <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7d5f36"/>
          <stop offset=".22" stop-color="#c9a468"/>
          <stop offset=".38" stop-color="#f1dcaa"/>
          <stop offset=".5" stop-color="#c49c5e"/>
          <stop offset=".72" stop-color="#8f6d3e"/>
          <stop offset=".88" stop-color="#d2b075"/>
          <stop offset="1" stop-color="#6e522c"/>
        </linearGradient>
        <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff6de" stop-opacity=".75"/>
          <stop offset=".45" stop-color="#fff6de" stop-opacity="0"/>
          <stop offset=".55" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000" stop-opacity=".55"/>
        </linearGradient>
        <pattern id="brush" width="400" height="7" patternUnits="userSpaceOnUse">
          <rect width="400" height="1" y="1" fill="#fff" opacity=".10"/>
          <rect width="400" height="1" y="4" fill="#000" opacity=".10"/>
          <rect width="170" height="1" y="5.5" x="60" fill="#fff" opacity=".08"/>
        </pattern>
      </defs>
      <g id="pieces"></g>
    </svg>
  </div>

  <div class="tools">
    <button class="link" id="shuffle" type="button">↻ shuffle</button>
    <span class="hint">drag to move · tap to turn</span>
    <span class="stats"><span>moves <b id="moves">0</b></span><span>time <b id="time">0:00</b></span></span>
  </div>
  <div class="status" id="status" aria-live="polite"></div>

  <form class="answer" id="answer" autocomplete="off" novalidate>
    <div class="alabel">WHAT'S THE WORD?</div>
    <div id="pwwrap">
      <div id="dots" aria-hidden="true"><span class="slot"></span><span class="slot"></span><span class="slot"></span><span class="slot"></span></div>
      <input id="pw" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Four-letter answer">
    </div>
    <div><button type="submit" id="submit">submit</button></div>
    <div id="msg" aria-live="polite"></div>
  </form>
</div>

const svg=document.getElementById('svg'), layer=document.getElementById('pieces');
document.getElementById('frame').setAttribute('d',GEO.frame);
const TRAY={x0:64,y0:64,x1:1130,y1:422};
const SNAP=22;
let moves=0,start=null,timer=null,solved=false;
const P=GEO.pieces.map((g,i)=>{
  const el=document.createElementNS('http://www.w3.org/2000/svg','g');
  el.setAttribute('class','piece anim'); el.setAttribute('tabindex','0');
  el.setAttribute('aria-label','Piece '+(i+1));
  const NS='http://www.w3.org/2000/svg', mk=(tag,a)=>{const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);return n};
  const clip=mk('clipPath',{id:'clip'+i});clip.appendChild(mk('path',{d:g.d}));el.appendChild(clip);
  el.appendChild(mk('path',{d:g.d,fill:'url(#brass)'}));                       /* metal body */
  el.appendChild(mk('path',{d:g.d,fill:'url(#brush)'}));                       /* brushed grain */
  el.appendChild(mk('path',{d:g.d,fill:'none',stroke:'url(#rim)','stroke-width':'12','clip-path':'url(#clip'+i+')'})); /* bevelled edge light */
  const edge=mk('path',{d:g.d,fill:'none','stroke-width':'5','stroke-linejoin':'round',class:'edge'});edge.style.stroke='var(--bg)';
  el.appendChild(edge); layer.appendChild(el);
  return {el,hx:g.x,hy:g.y,w:g.w,h:g.h,x:g.x,y:g.y,r:0};
});
function draw(o){o.el.style.transform=`translate(${o.x}px,${o.y}px) rotate(${o.r}deg)`}
function ext(o){const q=((o.r%180)+180)%180===0;return {hw:(q?o.w:o.h)/2,hh:(q?o.h:o.w)/2}}
function lim(c,h,a,b){return h*2>=b-a?(a+b)/2:Math.min(b-h,Math.max(a+h,c))}
function clamp(o){const {hw,hh}=ext(o);o.x=lim(o.x,hw,0,1194);o.y=lim(o.y,hh,0,487)}
function home(o){return ((o.r%360)+360)%360===0 && Math.hypot(o.x-o.hx,o.y-o.hy)<SNAP}
function snap(o){if(home(o)){o.x=o.hx;o.y=o.hy}}
function setStatus(s){document.getElementById('status').textContent=s}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function tick(){if(start)document.getElementById('time').textContent=fmt(Math.floor((Date.now()-start)/1000))}
function bump(){if(solved){solved=false;setStatus('')}if(!start){start=Date.now();timer=setInterval(tick,500)}moves++;document.getElementById('moves').textContent=moves}
function check(){
  const ok=P.every(o=>home(o)&&o.x===o.hx&&o.y===o.hy);
  if(ok&&!solved&&start){solved=true;clearInterval(timer);tick();
    setStatus(`all pieces in. ${moves} moves, ${document.getElementById('time').textContent}.`);}
}
function shuffle(){
  solved=false;moves=0;start=null;clearInterval(timer);
  document.getElementById('moves').textContent='0';document.getElementById('time').textContent='0:00';
  setStatus('');
  const placed=[];
  P.forEach(o=>{
    o.r=90*Math.floor(Math.random()*4);
    let best=null,bs=1e9;
    for(let t=0;t<120;t++){
      const {hw,hh}=ext(o);
      const x=lim(TRAY.x0+Math.random()*(TRAY.x1-TRAY.x0),hw,TRAY.x0,TRAY.x1), y=lim(TRAY.y0+Math.random()*(TRAY.y1-TRAY.y0),hh,TRAY.y0-40,TRAY.y1+40);
      let s=0; for(const q of placed){const dx=Math.abs(x-q.x),dy=Math.abs(y-q.y);s+=Math.max(0,170-dx)*Math.max(0,140-dy)}
      if(Math.hypot(x-o.hx,y-o.hy)<SNAP*3&&o.r%360===0)s+=1e7;
      if(s<bs){bs=s;best={x,y}}
    }
    o.x=best.x;o.y=best.y;placed.push(o);draw(o);
  });
  P.slice().sort(()=>Math.random()-.5).forEach(o=>layer.appendChild(o.el));
}
function pt(e){const m=svg.getScreenCTM().inverse();return new DOMPoint(e.clientX,e.clientY).matrixTransform(m)}
let drag=null;
P.forEach(o=>{
  o.el.addEventListener('pointerdown',e=>{
    e.preventDefault();o.el.setPointerCapture(e.pointerId);layer.appendChild(o.el);
    const p=pt(e);drag={o,dx:p.x-o.x,dy:p.y-o.y,sx:e.clientX,sy:e.clientY,moved:false};
  });
  o.el.addEventListener('pointermove',e=>{
    if(!drag||drag.o!==o)return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<5)return;
    if(!drag.moved){drag.moved=true;o.el.classList.remove('anim');o.el.classList.add('drag')}
    const p=pt(e);o.x=p.x-drag.dx;o.y=p.y-drag.dy;clamp(o);draw(o);
  });
  const end=e=>{
    if(!drag||drag.o!==o)return;
    o.el.classList.add('anim');o.el.classList.remove('drag');
    if(!drag.moved)o.r+=90;
    clamp(o);snap(o);draw(o);bump();drag=null;check();
  };
  o.el.addEventListener('pointerup',end);o.el.addEventListener('pointercancel',end);
  o.el.addEventListener('keydown',e=>{
    const k=e.key,st=e.shiftKey?20:5;let hit=true;
    if(k==='r'||k==='R'||k===' '||k==='Enter')o.r+=90;
    else if(k==='ArrowLeft')o.x-=st;else if(k==='ArrowRight')o.x+=st;
    else if(k==='ArrowUp')o.y-=st;else if(k==='ArrowDown')o.y+=st;else hit=false;
    if(!hit)return;e.preventDefault();clamp(o);snap(o);draw(o);bump();check();
  });
});
document.getElementById('shuffle').onclick=shuffle;
shuffle();

/* Answer: stored as a hash so the word isn't readable in the page source. */
const ANSWER_HASH=2089356108;
function hash(s){let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return h}
const pw=document.getElementById('pw'), slots=[...document.querySelectorAll('.slot')], form=document.getElementById('answer'), msg=document.getElementById('msg');
function paint(){const v=pw.value;slots.forEach((s,i)=>{s.textContent=v[i]||'';s.classList.toggle('cur',document.activeElement===pw&&i===Math.min(v.length,3))})}
pw.addEventListener('input',()=>{pw.value=pw.value.replace(/[^a-z]/gi,'').slice(0,4).toUpperCase();form.classList.remove('bad','ok');msg.textContent='';paint()});
pw.addEventListener('focus',paint);pw.addEventListener('blur',paint);
form.addEventListener('submit',e=>{
  e.preventDefault();
  const w=pw.value;
  form.classList.remove('bad','ok');void form.offsetWidth;
  if(w.length<4){msg.textContent='four letters.';pw.focus();return}
  if(hash(w)===ANSWER_HASH){form.classList.add('ok');msg.textContent='that’s the word.';pw.blur();}
  else{form.classList.add('bad');msg.textContent='not quite.';}
});
</script>

</html>
