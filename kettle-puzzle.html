<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cipher Brewing</title>
<style>
:root{
  --bg:#0a0a0a; --ink:#cfcfcf; --ink-dim:#8a8a8a; --ink-faint:#5a5a5a;
  --line:#333; --line-soft:#222; --amber:#c9a26a; --err:#7a4a4a;
  --mono:"SFMono-Regular",ui-monospace,"Menlo","Consolas",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased;padding:48px 16px}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.brandmark{font-size:12px;letter-spacing:.4em;color:var(--ink-faint);margin-bottom:3rem;padding-left:.4em}
.prompt{font-size:13px;letter-spacing:.12em;color:var(--ink-dim);line-height:1.9;margin:0 0 2.4rem}

/* Gate */
#gate{width:100%;display:flex;flex-direction:column;align-items:center}
.words{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:2rem}
.wordin{width:120px;background:transparent;border:0;border-bottom:2px solid var(--line);color:#e8e8e8;font-family:var(--mono);font-size:18px;text-align:center;padding:8px 4px;letter-spacing:.08em;border-radius:0;transition:border-color .3s}
.wordin:focus{outline:none;border-bottom-color:var(--ink-faint)}
#gate.ok .wordin{border-bottom-color:var(--amber);color:var(--amber)}
#gate.bad .wordin{border-bottom-color:var(--err)}
#gate.bad .words{animation:shake .35s}
#submit{background:transparent;border:.5px solid var(--line);color:var(--ink-dim);font-family:var(--mono);font-size:12px;letter-spacing:.2em;padding:10px 22px;border-radius:8px;cursor:pointer;margin-bottom:1.6rem;transition:border-color .3s,color .3s}
#submit:hover,#submit:focus-visible{border-color:var(--amber);color:var(--amber);outline:none}
#msg{font-size:12px;letter-spacing:.1em;color:var(--ink-faint);min-height:18px}
#gate.ok #msg{color:var(--amber)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){#gate.bad .words{animation:none}}

/* Story */
#reveal{width:100%;text-align:left;line-height:1.8;font-size:14px;color:var(--ink)}
#reveal .rlabel{font-size:11px;letter-spacing:.2em;color:var(--ink-faint);margin-bottom:2rem;text-align:center}
#reveal h1{font-size:20px;font-weight:400;letter-spacing:.05em;color:#e8e8e8;margin:0 0 1.6rem;text-align:center}
#reveal p{margin:0 0 1.2rem;color:var(--ink-dim)}
</style>
</head>
<body>

<div class="wrap">
  <div class="brandmark">CIPHER BREWING</div>

  <!-- GATE: shown first -->
  <div id="gate">
    <p class="prompt">enter the four words<br>to continue.</p>
    <form id="form" autocomplete="off" novalidate>
      <div class="words">
        <input class="wordin" maxlength="20" aria-label="Word 1" autocapitalize="none" autocorrect="off" spellcheck="false">
        <input class="wordin" maxlength="20" aria-label="Word 2" autocapitalize="none" autocorrect="off" spellcheck="false">
        <input class="wordin" maxlength="20" aria-label="Word 3" autocapitalize="none" autocorrect="off" spellcheck="false">
        <input class="wordin" maxlength="20" aria-label="Word 4" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div><button type="submit" id="submit">continue</button></div>
      <div id="msg" aria-live="polite"></div>
    </form>
  </div>

  <!-- STORY: shown after the correct four words -->
  <section id="reveal" hidden>
    <div class="rlabel">CIPHER BREWING</div>
    <h1>STORY TITLE HERE</h1>
    <p>Replace this with the grower's story.</p>
    <p>Add as many paragraphs as needed.</p>
  </section>
</div>

<script>
/* ANSWER: the four words, in order, joined with "|" and hashed.
   Replace 0 with the number printed by the console snippet. */
const ANSWER_HASH=0;
function hash(s){let h=5381;for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return h}

const inputs=[...document.querySelectorAll('.wordin')];
const gate=document.getElementById('gate');
const form=document.getElementById('form');
const msg=document.getElementById('msg');

inputs.forEach((inp,i)=>{
  inp.addEventListener('input',()=>{
    gate.classList.remove('bad','ok');msg.textContent='';
    if(inp.value.length>=inp.maxLength && inputs[i+1]) inputs[i+1].focus();
  });
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      if(inputs[i+1]) inputs[i+1].focus(); else form.requestSubmit();
    }
  });
});

form.addEventListener('submit',e=>{
  e.preventDefault();
  gate.classList.remove('bad','ok');void gate.offsetWidth;
  const words=inputs.map(inp=>inp.value.trim().toLowerCase().replace(/[^a-z]/g,''));
  if(words.some(w=>w.length===0)){
    msg.textContent='four words.';
    const empty=inputs.find(inp=>!inp.value.trim());if(empty)empty.focus();
    return;
  }
  if(hash(words.join('|'))===ANSWER_HASH){
    gate.classList.add('ok');msg.textContent='welcome.';
    setTimeout(()=>{
      gate.hidden=true;
      document.getElementById('reveal').hidden=false;
      window.scrollTo({top:0,behavior:'smooth'});
    },700);
  } else {
    gate.classList.add('bad');msg.textContent='not quite.';
  }
});
</script>

</body>
</html>
